<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="coom-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="coom-loop-l" x1="12" y1="22" x2="34" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="coom-loop-r" x1="30" y1="22" x2="52" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <!-- Outer C-shaped orbital ring -->
  <path d="M49.5 16.5A23.5 23.5 0 1 0 49.5 47.5" stroke="url(#coom-ring)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Interlocking oo infinity loops -->
  <circle cx="22.5" cy="32" r="9.5" stroke="url(#coom-loop-l)" stroke-width="4.8"/>
  <circle cx="41.5" cy="32" r="9.5" stroke="url(#coom-loop-r)" stroke-width="4.8"/>
  <!-- Signal paths -->
  <path d="M22.5 32H41.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32C32 25 30 20 30 16" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32C32 39 30 44 30 48" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <!-- Agent runtime accent nodes -->
  <circle cx="22.5" cy="32" r="3.4" fill="#6366F1"/>
  <circle cx="41.5" cy="32" r="3.4" fill="#10B981"/>
  <circle cx="30" cy="15.5" r="3.2" fill="#22D3EE"/>
  <circle cx="30" cy="48.5" r="3.2" fill="#10B981"/>
</svg>
