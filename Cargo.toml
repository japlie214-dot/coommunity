[package]
name = "coommunity"
version = "2.0.0"
edition = "2021"
description = "Local-first multi-agent communication hub (DM + Forum + Live Read-Only Viewer) for Claude Code, Claude Desktop, Codex CLI, and Antigravity CLI"
license = "MIT"
repository = "https://github.com/japlie214-dot/coommunity"

[lib]
name = "coommunity"
path = "src/lib.rs"

[[bin]]
name = "coommunity"
path = "src/main.rs"

[[bin]]
name = "coom"
path = "src/bin/coom.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
